name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    # 'aur' environment carries the AUR secrets behind a required-reviewer
    # gate: each release waits for a manual approve before publishing.
    environment: aur
    steps:
      - uses: actions/checkout@v6

      - name: version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: source tarball
        run: |
          git archive --format=tar.gz \
            --prefix="waystone-${{ steps.ver.outputs.version }}/" \
            -o "waystone-${{ steps.ver.outputs.version }}.tar.gz" \
            "$GITHUB_REF_NAME"

      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "waystone-${{ steps.ver.outputs.version }}.tar.gz" \
            --generate-notes

      - name: render AUR PKGBUILD
        run: |
          SHA=$(sha256sum "waystone-${{ steps.ver.outputs.version }}.tar.gz" | cut -d' ' -f1)
          sed -e "s/@VERSION@/${{ steps.ver.outputs.version }}/" \
              -e "s/@SHA256@/${SHA}/" \
              packaging/PKGBUILD.release > PKGBUILD.aur

      - name: publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: waystone
          pkgbuild: PKGBUILD.aur
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "release ${{ github.ref_name }}"

  # Keep the bug-report version dropdown showing the last 5 releases.
  issue-template:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: insert version into dropdown
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'EOF'
          import pathlib
          import re
          import sys

          ver = sys.argv[1]
          p = pathlib.Path(".github/ISSUE_TEMPLATE/bug_report.yml")
          out, versions, in_block = [], [ver], False
          for line in p.read_text().splitlines(keepends=True):
              if "# versions-start" in line:
                  in_block = True
                  out.append(line)
              elif "# versions-end" in line:
                  seen = list(dict.fromkeys(versions))[:5]
                  out.extend(f"        - {v}\n" for v in seen)
                  out.append(line)
                  in_block = False
              elif in_block:
                  m = re.match(r"\s*-\s*(.+?)\s*$", line)
                  if m:
                      versions.append(m.group(1))
              else:
                  out.append(line)
          p.write_text("".join(out))
          EOF
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_TEMPLATE/bug_report.yml
          git diff --cached --quiet || {
            git commit -m "docs: add ${GITHUB_REF_NAME} to bug report version dropdown"
            git push
          }
